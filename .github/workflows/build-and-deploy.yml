name: Build and Deploy

on:
  push:
    tags:
      - '*'

env:
  REGISTRY: ${{ vars.DOCKERHUB_HOST }}
  IMAGE_PREFIX: ${{ vars.DOCKERHUB_HOST != '' && format('{0}/', vars.DOCKERHUB_HOST) || '' }}
  BASE_IMAGE: ctezlifrn/avamoodlebase
  MAIN_IMAGE: ctezlifrn/avamoodle
  DEV_IMAGE: ctezlifrn/avamoodledev

jobs:
  detect-base-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_changed: ${{ steps.changes.outputs.base }}
      # Novas saídas de segurança exportadas para os outros jobs
      is_prod: ${{ steps.tag_check.outputs.is_prod }}
      is_test: ${{ steps.tag_check.outputs.is_test }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validar Formato da Tag (Trava de Segurança)
        id: tag_check
        run: |
          TAG="${{ github.ref_name }}"
          echo "Avaliando a tag: $TAG"

          # Trava PROD: Aceita APENAS números separados por pontos (ex: 4.5.11.056)
          if [[ "$TAG" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "✅ Tag de PRODUÇÃO identificada e validada."
            echo "is_prod=true" >> $GITHUB_OUTPUT
            echo "is_test=false" >> $GITHUB_OUTPUT

          # Trava TEST: Aceita a sequência de números obrigatoriamente terminada em -test
          elif [[ "$TAG" =~ ^[0-9]+(\.[0-9]+)+-test$ ]]; then
            echo "✅ Tag de TESTE identificada e validada."
            echo "is_prod=false" >> $GITHUB_OUTPUT
            echo "is_test=true" >> $GITHUB_OUTPUT

          # Bloqueio padrão para qualquer outra coisa (ex: v1, bugfix, wip)
          else
            echo "🚫 Tag bloqueada. Não segue o padrão numérico de prod ou test."
            echo "is_prod=false" >> $GITHUB_OUTPUT
            echo "is_test=false" >> $GITHUB_OUTPUT
          fi

      - name: Check changes in /base directory
        id: changes
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          echo "Current tag: $CURRENT_TAG"

          ALL_TAGS=$(git tag --sort=-version:refname | head -10)
          echo "Recent tags: $ALL_TAGS"

          PREV_TAG=""
          for tag in $ALL_TAGS; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              PREV_TAG=$tag
              break
            fi
          done

          echo "Previous tag: $PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found"
            if [ -d "base" ]; then
              echo "First release - base directory exists"
              echo "base=true" >> $GITHUB_OUTPUT
            else
              echo "base=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Comparing base/ between $PREV_TAG and $CURRENT_TAG"
            if git diff $PREV_TAG $CURRENT_TAG -- base/ | grep -q .; then
              echo "Changes detected in base/"
              echo "base=true" >> $GITHUB_OUTPUT
            else
              echo "No changes in base/"
              echo "base=false" >> $GITHUB_OUTPUT
            fi
          fi

  build-base:
    needs: detect-base-changes
    # Só builda a base se houve mudança E se a tag passou na nossa trava (prod ou test)
    if: |
      needs.detect-base-changes.outputs.base_changed == 'true' &&
      (needs.detect-base-changes.outputs.is_prod == 'true' || needs.detect-base-changes.outputs.is_test == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract Clean Version
        run: echo "CLEAN_VERSION=${GITHUB_REF_NAME%-test}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./base
          push: true
          tags: ${{ env.IMAGE_PREFIX }}${{ env.BASE_IMAGE }}:${{ env.CLEAN_VERSION }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}${{ env.BASE_IMAGE }}:latest
          cache-to: type=inline
          build-args: |
            NVM_INSTALL_SHA256=${{ vars.NVM_INSTALL_SHA256 }}
            PHPUNIT_11_PHAR_SHA256=${{ vars.PHPUNIT_11_PHAR_SHA256 }}

  build-main:
    # Agora ele escuta a trava do detect-base-changes
    needs: [detect-base-changes, build-base]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.detect-base-changes.outputs.is_prod == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract Clean Version
        run: echo "CLEAN_VERSION=${GITHUB_REF_NAME%-test}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push main image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./main
          push: true
          tags: ${{ env.IMAGE_PREFIX }}${{ env.MAIN_IMAGE }}:${{ github.ref_name }}
          build-args: |
            AVA_IMAGE_VERSION=${{ env.CLEAN_VERSION }}
            NVM_INSTALL_SHA256=${{ vars.NVM_INSTALL_SHA256 }}
            PHPUNIT_11_PHAR_SHA256=${{ vars.PHPUNIT_11_PHAR_SHA256 }}

  build-test:
    # Escutando a trava de dev
    needs: [detect-base-changes, build-base]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.detect-base-changes.outputs.is_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract Clean Version
        run: echo "CLEAN_VERSION=${GITHUB_REF_NAME%-test}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./main
          target: dev
          push: true
          tags: ${{ env.IMAGE_PREFIX }}${{ env.DEV_IMAGE }}:${{ github.ref_name }}
          build-args: |
            AVA_IMAGE_VERSION=${{ env.CLEAN_VERSION }}
            NVM_INSTALL_SHA256=${{ vars.NVM_INSTALL_SHA256 }}
            PHPUNIT_11_PHAR_SHA256=${{ vars.PHPUNIT_11_PHAR_SHA256 }}

  deploy-test:
    needs: [detect-base-changes, build-test, build-base]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.build-test.result == 'success' &&
      needs.detect-base-changes.outputs.is_test == 'true'
    runs-on: [self-hosted, runner-dead]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enviar Chart do Helm
        run: |
          ssh ${{ vars.K8S_HOST }} "rm -rf /tmp/moodle-chart"
          scp -r ./helm ${{ vars.K8S_HOST }}:/tmp/moodle-chart

      - name: Executar Upgrade no Helm
        run: |
          DEPLOY_TAG="${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"

          ssh ${{ vars.K8S_HOST }} "helm upgrade --install moodle /tmp/moodle-chart \
            --namespace ava \
            --set image.tag=$DEPLOY_TAG \
            --set image.repository=${{ env.IMAGE_PREFIX }}${{ env.DEV_IMAGE }}"

  deploy-main:
    needs: [detect-base-changes, build-main]
    if: |
      always() &&
      needs.build-main.result == 'success' &&
      needs.detect-base-changes.outputs.is_prod == 'true'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Executar Upgrade no Docker Compose
        run: |
          DEPLOY_TAG="${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          ssh -o StrictHostKeyChecking=no ${{ vars.SSH_HOST }} "sed -i \"s/avamoodle:.*/avamoodle:$DEPLOY_TAG/g\" /var/dockers/docker-compose.yml"
          ssh -o StrictHostKeyChecking=no ${{ vars.SSH_HOST }} "cd /var/dockers && docker compose pull && docker compose down ava && docker compose up -d ava"
